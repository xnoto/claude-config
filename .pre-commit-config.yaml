repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # frozen: v6.0.0
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # pragma: allowlist secret
    hooks:
      - id: check-json
        files: ^mcp\.json$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
